<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" font-family="Helvetica, Arial, sans-serif">
  <title>The occlusion span map: one merged x range per band</title>
  <!-- canvas, split into four horizontal bands -->
  <rect x="20" y="20" width="260" height="160" fill="#f7f7f5" stroke="#888" stroke-width="1"/>
  <line x1="20" y1="60" x2="280" y2="60" stroke="#bbb" stroke-dasharray="3 3"/>
  <line x1="20" y1="100" x2="280" y2="100" stroke="#bbb" stroke-dasharray="3 3"/>
  <line x1="20" y1="140" x2="280" y2="140" stroke="#bbb" stroke-dasharray="3 3"/>
  <!-- the occluder's convex outline -->
  <polygon points="50,60 230,60 250,140 30,140" fill="#c9d6e8" stroke="#345" stroke-width="1.5"/>
  <!-- the span map: each band's merged range that the occluder covers across the whole band -->
  <rect x="50" y="60" width="180" height="40" fill="#3060c0" fill-opacity="0.35"/>
  <rect x="40" y="100" width="200" height="40" fill="#3060c0" fill-opacity="0.35"/>
  <!-- object A: inside one range in every band it touches, so it is hidden -->
  <rect x="100" y="75" width="60" height="20" fill="none" stroke="#c03030" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- object B: pokes past the right edge of the range in band 2, so it still draws -->
  <rect x="200" y="85" width="60" height="30" fill="#3a9a5a" fill-opacity="0.8"/>
  <!-- labels -->
  <text x="150" y="16" font-size="11" text-anchor="middle" fill="#222">canvas, split into horizontal bands</text>
  <text x="158" y="128" font-size="10" text-anchor="middle" fill="#fff">occluder</text>
  <text x="130" y="90" font-size="9" text-anchor="middle" fill="#c03030">hidden</text>
  <text x="230" y="78" font-size="9" text-anchor="middle" fill="#2a6a3a">drawn</text>
  <text x="150" y="192" font-size="10" text-anchor="middle" fill="#444">shaded: the span for each band</text>
</svg>
