<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Controller</title>
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; width: 100%; overflow: hidden; position: fixed; inset: 0;
      background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    }
    #bar {
      position: absolute; top: 0; left: 0; right: 0; height: 40px; z-index: 10;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; font-weight: 600; letter-spacing: .02em;
      background: linear-gradient(#0d1117f0, #0d1117a0 80%, transparent);
      padding: 0 10px;
    }
    #dot { width: 8px; height: 8px; border-radius: 50%; background: #f85149; flex: none; transition: background .25s; box-shadow: 0 0 6px #f8514980; }
    #dot.on { background: #3fb950; box-shadow: 0 0 6px #3fb95080; }
    #players { opacity: .65; font-weight: 500; }
    #players:empty { display: none; }

    #gamepadHint {
      position: absolute; top: 40px; left: 0; right: 0; z-index: 10;
      text-align: center; font-size: 11px; opacity: .5; padding: 4px 10px;
    }

    /* Base (portrait/default): small corner touch zones - nipplejs's "static"
       mode spawns the joystick at this element's own 50%/50% (see bindStick()),
       so the zone's SIZE AND POSITION are what actually place the joystick, not
       just decoration - sizing only a visual hint here (an earlier version of
       this page did that) leaves the real joystick spawning at the zone's true
       center, wherever that ends up being. */
    .zone { position: absolute; bottom: 24px; width: 150px; height: 150px; }
    #zone1 { left: 24px; }
    #zone2 { right: 24px; }

    /* Landscape (the common orientation for actually playing): the zone becomes
       the whole left/right half of the screen, like a real mobile game's
       virtual pad - any touch anywhere in it now drags the joystick, a much
       bigger and easier touch target, not just a visual change. The joystick
       itself still only ever spawns at the zone's 50%/50%, i.e. screen center
       height, which is why the buttons below move to the top corner in this
       orientation instead of sitting where they'd now overlap it. */
    @media (orientation: landscape) {
      .zone { top: 40px; bottom: 0; left: auto; right: auto; width: 50%; height: auto; }
      #zone1 { left: 0; }
      #zone2 { right: 0; }
    }

    .btn {
      position: absolute; width: 62px; height: 62px; border-radius: 50%;
      background: #21262dd0; color: #e6edf3; border: 2px solid #30363d;
      font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px #00000060; z-index: 5;
    }
    .btn:active { background: #30363dd0; border-color: #484f58; }
    /* Portrait: A/B stacked just above the right stick's small corner zone;
       Back sits by itself near the status bar, well clear of both sticks. */
    #btna { bottom: 200px; right: 30px; }
    #btnb { bottom: 270px; right: 100px; }
    #btnback { top: 52px; left: 16px; width: auto; height: 34px; border-radius: 17px; padding: 0 16px; font-size: 12px; }
    /* Landscape: the right zone is now the whole right half with its joystick
       at screen-center height, so A/B move to a top corner clear of it. Back
       stays in the same top-left spot in both orientations. */
    @media (orientation: landscape) {
      #btna { bottom: auto; top: 56px; right: 20px; }
      #btnb { bottom: auto; top: 130px; right: 90px; }
    }

    #gamepadBanner {
      position: absolute; inset: 40px 0 0 0; z-index: 20;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; text-align: center; padding: 0 24px; background: #0d1117;
    }
    #gamepadBanner.show { display: flex; }
    #gamepadBanner .icon { font-size: 42px; }
    #gamepadBanner .sub { opacity: .55; font-size: 13px; max-width: 26em; }

    .hidden { visibility: hidden; }
  </style>
</head>
<body>
  <div id="bar">
    <span id="dot"></span>
    <span id="status">Connecting…</span>
    <span id="players"></span>
  </div>
  <div id="gamepadHint">Tip: you can also connect a game controller</div>

  <div id="gamepadBanner">
    <div class="icon">🎮</div>
    <div id="gamepadName">Gamepad connected</div>
    <div class="sub">Touch controls are hidden while a gamepad is active</div>
  </div>

  <div id="zone1" class="zone"></div>
  <div id="zone2" class="zone"></div>
  <button id="btna" class="btn">A</button>
  <button id="btnb" class="btn">B</button>
  <button id="btnback" class="btn">Back</button>

  <script>
    var sticks = { "1": { x: 0, y: 0 }, "2": { x: 0, y: 0 } };
    // Labeled "A"/"B"/"Back" on screen (generic, gamepad-style captions), but
    // sent over the wire as "ok"/"b"/"back" - "ok" and "back" are BGE's own
    // canonical button names (see BGE.buttonNameFromCode()/isButton()), so
    // pressing either also drives menus (Game.processFocusManagerInput()
    // dispatches controller input to the focus system, same as a real
    // remote's OK/Back would), not just whatever ControlMap action a game
    // separately binds them to. "b" is plain/generic - bind it to whatever a
    // given game wants via bindAction().
    var buttons = { ok: false, b: false, back: false };
    // "status" would shadow window.status (a no-op string setter in some browsers).
    var statusEl = document.getElementById("status");
    var dotEl = document.getElementById("dot");
    var playersEl = document.getElementById("players");
    var gamepadBannerEl = document.getElementById("gamepadBanner");
    var gamepadNameEl = document.getElementById("gamepadName");
    var touchEls = [document.getElementById("zone1"), document.getElementById("zone2"), document.getElementById("btna"), document.getElementById("btnb"), document.getElementById("btnback"), document.getElementById("gamepadHint")];
    var gamepadActive = false;
    var gamepadPollId = null;
    var playerIndex = null;
    var connectedCount = 1;
    var labels = {};
    var ws = null;

    function updateStatusText() {
      var open = ws && ws.readyState === WebSocket.OPEN;
      dotEl.className = open ? "on" : "";
      statusEl.textContent = open
        ? (playerIndex === null ? "Connected" : "Player " + (playerIndex + 1))
        : "Reconnecting…";
      // Only worth mentioning once there's actually more than one - "1 controller
      // connected" would just be restating the player-N text above for no reason.
      playersEl.textContent = open && connectedCount > 1 ? connectedCount + " controllers connected" : "";
    }

    function connect() {
      ws = new WebSocket("ws://" + location.host + "/ws");
      ws.onopen = updateStatusText;
      ws.onclose = function () {
        playerIndex = null;
        updateStatusText();
        setTimeout(connect, 2000);
      };
      ws.onerror = function () { ws.close(); };
      ws.onmessage = function (evt) {
        // {playerIndex, labels, connectedCount} - see
        // Game.broadcastControllerConnectionInfo()/enableControllerInput(). labels
        // aren't rendered by this simple demo page; a custom page could use them
        // to relabel its own buttons.
        var info;
        try {
          info = JSON.parse(evt.data);
        } catch (err) {
          console.error("Controller: could not parse server message", evt.data, err);
          return;
        }
        if (typeof info.playerIndex === "number") playerIndex = info.playerIndex;
        if (info.labels) labels = info.labels;
        if (typeof info.connectedCount === "number") connectedCount = info.connectedCount;
        updateStatusText();
      };
    }
    connect();

    function send() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ buttons: buttons, sticks: sticks }));
      }
    }

    // A stick/button only sends on an actual change, so a connection left
    // untouched (the common case - most play is intermittent) would
    // otherwise go silent for as long as the player doesn't move. On at
    // least one real device, the server's socket-read polling loop can't
    // reliably tell "idle but healthy" apart from "dead" on its own (see
    // ControllerServer.bs's staleReadPolls comment) and will close a
    // long-idle connection - this periodic resend keeps real bytes flowing
    // so that never happens, and still lets a genuinely dead connection
    // (tab closed, network gone) get cleaned up server-side once its
    // heartbeats actually stop arriving.
    setInterval(send, 1000);

    function bindStick(elementId, stickName) {
      // zIndex: nipplejs defaults to 999, which painted its joystick UI over
      // the A/B buttons once the zones grew large enough to visually overlap
      // them (landscape especially) - buttons use z-index 5, so 1 keeps
      // nipplejs comfortably under them without needing !important anywhere.
      var manager = nipplejs.create({ zone: document.getElementById(elementId), mode: "static", position: { left: "50%", top: "50%" }, color: "white", zIndex: 1 });
      manager.on("move", function (evt, data) {
        var rad = data.angle.radian;
        var force = Math.min(data.force, 1);
        sticks[stickName] = { x: Math.cos(rad) * force, y: Math.sin(rad) * force };
        send();
      });
      manager.on("end", function () {
        sticks[stickName] = { x: 0, y: 0 };
        send();
      });
    }
    bindStick("zone1", "1");
    bindStick("zone2", "2");

    function bindButton(elementId, buttonName) {
      var el = document.getElementById(elementId);
      var setPressed = function (pressed) {
        buttons[buttonName] = pressed;
        send();
      };
      el.addEventListener("touchstart", function (e) { e.preventDefault(); setPressed(true); });
      el.addEventListener("touchend", function (e) { e.preventDefault(); setPressed(false); });
      el.addEventListener("mousedown", function () { setPressed(true); });
      el.addEventListener("mouseup", function () { setPressed(false); });
    }
    bindButton("btna", "ok");
    bindButton("btnb", "b");
    // Back only ever "presses"/"releases" from a real touchstart/touchend (or
    // mousedown/mouseup) pair below, same as A/B - never something that can
    // fire repeatedly just from being held (the 1s heartbeat resend further
    // up only resends the *current* state, it doesn't synthesize a fresh
    // press). Server-side, Room.onInput()'s own `input.press` guard (see
    // examples/platformer's TitleRoom/MainRoom) is what actually makes a
    // long hold act once instead of repeatedly - documented here since it's
    // easy to assume this needs a client-side debounce and it doesn't.
    bindButton("btnback", "back");

    // Real Gamepad, if one is connected, overrides the on-screen controls - hide
    // the touch zones/buttons entirely (rather than just leaving them inert)
    // since a player holding a real gamepad has no reason to also see them, and
    // showing both invited pressing the wrong one. Buttons are named by their
    // Gamepad API buttons[] index ("0", "1", ...) so a custom page can bind to
    // any of them via bindAction(name, remoteButton, "0") - but the standard
    // mapping's face/menu buttons are ALSO aliased to the same "ok"/"b"/"back"
    // names the touch buttons use (see GAMEPAD_STANDARD_ALIASES below), so a
    // game that only bound those (the common case) works with a real gamepad
    // with no extra bindAction() calls.
    function setTouchControlsVisible(visible) {
      touchEls.forEach(function (el) { el.classList.toggle("hidden", !visible); });
    }

    // Indexes from the Gamepad API's "standard" mapping
    // (https://w3c.github.io/gamepad/#remapping): 0 = bottom face button
    // (A/Cross), 1 = right face button (B/Circle), 9 = Start/Menu.
    var GAMEPAD_STANDARD_ALIASES = { "0": "ok", "1": "b", "9": "back" };

    window.addEventListener("gamepadconnected", function (e) {
      gamepadActive = true;
      setTouchControlsVisible(false);
      gamepadNameEl.textContent = e.gamepad.id || "Gamepad connected";
      gamepadBannerEl.classList.add("show");
      updateStatusText();
      // e.gamepad.index is whatever slot the browser/OS assigned this pad -
      // NOT necessarily 0 (e.g. a previously connected-then-disconnected pad,
      // or another input device, can occupy slot 0) - getGamepads()[0] would
      // then silently and permanently return null/undefined here, making this
      // poll a no-op forever with no visible error, since this event already
      // fired and updated the banner/status regardless of index.
      var padIndex = e.gamepad.index;
      gamepadPollId = setInterval(function () {
        var pad = navigator.getGamepads()[padIndex];
        if (!pad) return;
        // The Gamepad API's Y axes are screen-convention (-1 = up); the engine
        // (and the nipplejs path above) use world space, where +1 is up.
        sticks["1"] = { x: pad.axes[0] || 0, y: -(pad.axes[1] || 0) };
        sticks["2"] = { x: pad.axes[2] || 0, y: -(pad.axes[3] || 0) };
        buttons = {};
        pad.buttons.forEach(function (b, i) {
          buttons[String(i)] = b.pressed;
          var alias = GAMEPAD_STANDARD_ALIASES[String(i)];
          if (alias) buttons[alias] = b.pressed;
        });
        send();
      }, 50);
    });

    window.addEventListener("gamepaddisconnected", function () {
      gamepadActive = false;
      if (gamepadPollId !== null) { clearInterval(gamepadPollId); gamepadPollId = null; }
      gamepadBannerEl.classList.remove("show");
      setTouchControlsVisible(true);
      buttons = {};
      sticks = { "1": { x: 0, y: 0 }, "2": { x: 0, y: 0 } };
      send();
      updateStatusText();
    });
  </script>
</body>
</html>
