<!doctype html>
<meta charset="utf-8">
<title>Prepare Flare sheet</title>
<pre id="out"></pre>
<script>
  // Query: src (file URL), first/last (frame columns to keep), cell (source cell size),
  // columns (output cells per row; cells stay row-major, so cell = direction * frames + frame).
  // keepShadow=1 keeps the baked-in shadow (near-black, partly transparent pixels);
  // otherwise it's removed. Keeps frames
  // first..last of every direction row and trims every cell to one shared bounding box.
  const q = new URLSearchParams(location.search);
  const cell = Number(q.get("cell") || 128);
  const first = Number(q.get("first")), last = Number(q.get("last"));
  const keepShadow = q.get("keepShadow") === "1";
  const img = new Image();
  img.onload = () => {
    const rows = img.height / cell;
    const src = document.createElement("canvas");
    src.width = img.width; src.height = img.height;
    const sctx = src.getContext("2d");
    sctx.drawImage(img, 0, 0);
    const data = sctx.getImageData(0, 0, src.width, src.height);
    const d = data.data;

    let shadowX = 0, shadowY = 0, shadowN = 0;
    const isShadow = (i) => d[i + 3] > 0 && d[i + 3] < 230 && d[i] < 24 && d[i + 1] < 24 && d[i + 2] < 24;
    for (let y = 0; y < src.height; y++) {
      for (let x = 0; x < src.width; x++) {
        const i = (y * src.width + x) * 4;
        if (isShadow(i)) {
          // Shadow centroid of the first kept frame in each row gives the feet position.
          if (Math.floor(x / cell) === first) { shadowX += x % cell; shadowY += y % cell; shadowN++; }
          if (!keepShadow) d[i + 3] = 0;
        }
      }
    }
    sctx.putImageData(data, 0, 0);

    let minX = cell, minY = cell, maxX = -1, maxY = -1;
    for (let r = 0; r < rows; r++) {
      for (let f = first; f <= last; f++) {
        for (let y = 0; y < cell; y++) {
          for (let x = 0; x < cell; x++) {
            if (d[((r * cell + y) * src.width + f * cell + x) * 4 + 3] > 8) {
              if (x < minX) minX = x; if (x > maxX) maxX = x;
              if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
          }
        }
      }
    }
    const w = maxX - minX + 1, h = maxY - minY + 1;
    const frames = last - first + 1;
    const columns = Number(q.get("columns") || frames);
    const outRows = Math.ceil(rows * frames / columns);
    const out = document.createElement("canvas");
    out.width = columns * w; out.height = outRows * h;
    const octx = out.getContext("2d");
    for (let r = 0; r < rows; r++) {
      for (let f = 0; f < frames; f++) {
        const index = r * frames + f;
        octx.drawImage(src, (first + f) * cell + minX, r * cell + minY, w, h, (index % columns) * w, Math.floor(index / columns) * h, w, h);
      }
    }
    const feet = shadowN ? { x: shadowX / shadowN - minX, y: shadowY / shadowN - minY } : null;
    const info = { cellWidth: w, cellHeight: h, columns, rows: outRows, framesPerDirection: frames, width: out.width, height: out.height, feet, anchor: feet && { x: +(feet.x / w).toFixed(3), y: +(feet.y / h).toFixed(3) } };
    document.getElementById("out").textContent = JSON.stringify(info) + "\n" + out.toDataURL("image/png");
  };
  img.src = q.get("src");
</script>
