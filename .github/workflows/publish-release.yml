name: Publish Release

# Runs when a release/x.y.z PR (opened by initialize-release.yml) is merged: tags
# the merge commit, publishes to npm and creates the GitHub release. Safe to re-run
# after a partial failure - each step skips what's already done.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-release:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Read version
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$BRANCH" != "release/$VERSION" ]; then
            echo "::error::branch $BRANCH doesn't match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Install ropm modules
        run: npx ropm install

      - name: Tag
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "brighterscript-game-engine@$VERSION" version > /dev/null 2>&1; then
            echo "$VERSION is already on npm"
          else
            # `prepack` builds the engine into build/.
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "release v$VERSION already exists"
          else
            node scripts/release-changelog.js notes "$VERSION" > "$RUNNER_TEMP/notes.md"
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
