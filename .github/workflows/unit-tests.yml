name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install ropm modules
        run: npx ropm install

      - name: Unit tests (Rooibos, headless via brs-cli)
        run: |
          (while true; do echo "MEM $(date +%T) $(free -m | awk '/Mem:/{print "used="$3" avail="$7}') brs=$(ps -C node -o rss= | sort -n | tail -1)"; sleep 1; done) &
          npm run test:ci
