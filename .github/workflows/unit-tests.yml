name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # The shard names come from the runner itself, so a new shard is picked up automatically
  list-shards:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: echo "shards=$(node scripts/run-tests-sharded.js --list)" >> "$GITHUB_OUTPUT"

  # One runner per shard (#523)
  unit-tests:
    needs: list-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.list-shards.outputs.shards) }}
    name: unit-tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install ropm modules
        run: npx ropm install

      - name: Unit tests (Rooibos, headless via brs-cli)
        run: npm run test:ci
        env:
          TEST_SHARDS: ${{ matrix.shard }}
