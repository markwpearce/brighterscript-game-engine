name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install ropm modules
        run: npx ropm install

      - name: Validate (bsc type-check)
        run: npm run validate

      - name: Lint (bslint)
        run: npm run lint

  # The examples, split across runners (#523)
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: examples (${{ matrix.shard }}/3)
    env:
      EXAMPLES_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install example dependencies
        run: npm run prepare-examples

      - name: Validate examples (bsc type-check)
        run: node scripts/examples.js validate

  # The required status check: passes only when the engine and every examples shard did
  validate:
    needs: [engine, examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Engine and examples passed
        run: test "${{ needs.engine.result }}" = success && test "${{ needs.examples.result }}" = success

  ropm-consumer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install ropm modules
        run: npx ropm install

      - name: Real ropm-install end-to-end check
        run: npm run test:ropm-consumer
