name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install ropm modules
        run: npx ropm install

      - name: Validate (bsc type-check)
        run: npm run validate

      - name: Lint (bslint)
        run: npm run lint

  # The examples, split across runners (#523)
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: examples (${{ matrix.shard }}/3)
    env:
      EXAMPLES_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install example dependencies
        run: npm run prepare-examples

      - name: Validate examples (bsc type-check)
        run: node scripts/examples.js validate

  # New asset files must be named in a credits file (#696)
  asset-credits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check new assets are credited
        run: node scripts/check-asset-credits.js origin/${{ github.base_ref }}

  # The required status check: passes only when the engine, every examples shard and the credits check did
  validate:
    needs: [engine, examples, asset-credits]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Engine, examples and credits passed
        run: |
          test "${{ needs.engine.result }}" = success
          test "${{ needs.examples.result }}" = success
          test "${{ needs.asset-credits.result }}" = success -o "${{ needs.asset-credits.result }}" = skipped

  ropm-consumer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install ropm modules
        run: npx ropm install

      - name: Real ropm-install end-to-end check
        run: npm run test:ropm-consumer
